[project]
name = "personal-research-assistant"
version = "1.0.0"
description = "AI-powered academic research assistant that fetches arXiv papers and generates summaries"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "gradio>=4.44.0,<5.0.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.23.0",
    "arxiv>=1.4.8",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
